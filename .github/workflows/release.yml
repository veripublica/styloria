name: Release

# styloria is a library crate (no binaries to attach), so a release is just a
# GitHub Release whose body is this version's CHANGELOG.md section — extracted
# automatically, so the notes never have to be filled in by hand. The crates.io
# upload is a separate workflow (`publish-crate.yml`) fired by the same tag, so
# the two run in parallel and neither waits on the other.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Only for creating the GitHub Release.
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # Populate the GitHub Release body from this version's CHANGELOG.md
      # section, so the release notes never have to be filled in by hand.
      # A missing section yields empty notes — the release still publishes, so
      # confirm the CHANGELOG has a `## [x.y.z]` heading before tagging.
      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          ver="${tag#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {inblk=1; next}
            inblk && /^## \[/ {exit}
            inblk { if (!started && $0 ~ /^[[:space:]]*$/) next; started=1; buf[n++]=$0 }
            END { last=n-1; while (last>=0 && buf[last] ~ /^[[:space:]]*$/) last--; for (i=0;i<=last;i++) print buf[i] }
          ' CHANGELOG.md > RELEASE_NOTES.md
          printf '\n\nFull notes: [CHANGELOG.md](https://github.com/veripublica/styloria/blob/main/CHANGELOG.md). Also on [crates.io](https://crates.io/crates/styloria/%s).\n' "$ver" >> RELEASE_NOTES.md
          echo "----- extracted release notes -----"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
