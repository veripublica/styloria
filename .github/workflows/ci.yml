name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
# Read-only token: CI builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest ships stable Rust + rustfmt/clippy; only the wasm target
      # has to be added, for the smoke build below.
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      # No `--locked` anywhere here: styloria is a library and gitignores
      # Cargo.lock, so there is nothing to lock against (same reasoning as
      # publish-crate.yml, and the opposite of epubveri, which is a CLI app
      # and does commit its lock file).
      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The stylesheets of epub-test-books, at a pinned tag (the commit it
      # names, so a moved tag cannot change what is tested). tests/test_books.rs
      # checks styloria's own invariants on them; the sets' expected results
      # are verifier findings, not ours. `unzip` is the runner's: no Cargo
      # dependency, not even a dev one. Its exit code 11 means a book holds
      # no .css file; some books are broken containers on purpose, which
      # unzip refuses. Both are counted and skipped.
      - name: Check out epub-test-books
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: veripublica/epub-test-books
          ref: 57807b0df4a1e3d961be986d6b895157db90bb17 # v0.8.0
          path: test-books
          persist-credentials: false

      - name: Unzip the test books' stylesheets
        run: |
          out="$RUNNER_TEMP/test-books-css"
          mkdir -p "$out"
          n=0 none=0 refused=0
          while IFS= read -r -d '' book; do
            n=$((n + 1))
            rc=0
            unzip -qq -o -C "$book" '*.css' -d "$out/$n" 2>/dev/null || rc=$?
            case $rc in
              0) ;;
              11) none=$((none + 1)) ;;
              *) refused=$((refused + 1)) ;;
            esac
          done < <(find test-books/books -name '*.epub' -print0 | sort -z)
          css=$(find "$out" -iname '*.css' | wc -l)
          echo "$n books: $css stylesheets, $none without one, $refused refused by unzip"
          echo "STYLORIA_TEST_BOOKS_CSS=$out" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --all-features

      # Without `legacy-cjk` the multi-byte encodings are errors, and some
      # tests check exactly that.
      - name: Test (default features)
        run: cargo test

      # styloria is what epubveri's CSS checks are built on, and epubveri
      # ships a WebAssembly package - so anything that compiles here but not
      # for wasm32 breaks a downstream release rather than this repo. Catch it
      # on the commit that causes it, not two repos later.
      - name: Build for wasm32
        run: |
          cargo build --lib --target wasm32-unknown-unknown
          cargo build --lib --target wasm32-unknown-unknown --all-features

  # **The published MSRV, actually tested.** `rust-version` in Cargo.toml is a
  # promise on crates.io: cargo refuses to resolve a dependency that needs
  # more, and a user on an older toolchain reads it as "this will build".
  # styloria sits under epubveri (and epubsana under that), so a silent rise
  # here raises the floor of both consumers too.
  #
  # The version is read out of Cargo.toml rather than written here: a
  # hard-coded number would be a second declaration free to drift from the
  # first. Raise `rust-version` and the next push tests the new floor.
  #
  # `check` rather than `test`: the promise is that the crate compiles on that
  # toolchain, not that our test harness does. No `--locked`, as above.
  # Copied from epubveri's `msrv` job.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$v" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"

      - name: Install it
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
          rustc -V

      - name: Compile at the floor
        run: cargo check --lib
