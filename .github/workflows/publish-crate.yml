name: Publish to crates.io

# Publishes the `styloria` crate when a `v*` tag is pushed — the same trigger
# that already creates the GitHub Release, so one `git push origin vX.Y.0`
# now does the whole release instead of ending with a manual `cargo publish`.
#
# AUTHENTICATION — trusted publishing (OIDC), no stored token. crates.io hands
# out a short-lived token in exchange for a GitHub-signed claim about *which
# repo and which workflow file* is asking; the action's post step revokes it
# when the job ends. So there is no long-lived CARGO_REGISTRY_TOKEN in the repo
# secrets to leak, and the token is useless anywhere but this workflow.
#
# ONE-TIME SETUP (owner, on crates.io): crates.io -> styloria -> Settings ->
# Trusted Publishing -> Add, with repository `veripublica/styloria` and
# workflow `publish-crate.yml`. Until that exists the auth step fails and
# nothing is published. Renaming this file breaks the trust link — re-point
# the crates.io entry at the new name if it is ever renamed.
#
# Publishing is IRREVERSIBLE: a version number, once used, can never be reused
# (only yanked). So the job refuses to publish unless the tag and the manifest
# agree, and the tests pass, before it uploads anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.0)"
        required: true
      # The trusted-publishing link lives in crates.io's settings, which are
      # only visible to the crate owner — there is no way to check from here
      # that it is configured correctly, and the natural test (publish
      # something) costs a version number that can never be reused. So: run
      # the OIDC exchange, prove a token comes back, publish nothing. Worth
      # running after the initial setup, and after anything that could break
      # the link — renaming this file, moving the repo, changing the owner.
      verify_only:
        description: "Only check that crates.io auth works; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC claim the auth action exchanges for a token.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Guard 1: the tag is the source of truth for the release, but
      # `cargo publish` reads the version out of Cargo.toml. If they disagree,
      # tagging v0.6.0 would happily publish 0.5.0 — burning a version number
      # on the wrong code, unfixably.
      - name: Verify tag matches the manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          got=$(cargo metadata --no-deps --format-version 1 \
                | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='styloria'))")
          echo "tag=$want  Cargo.toml=$got"
          [ "$want" = "$got" ] || { echo "::error::tag $tag does not match Cargo.toml version $got"; exit 1; }

      # Guard 2: make a re-run harmless. A `workflow_dispatch` backfill, or a
      # tag pushed twice, would otherwise fail on an "already uploaded" error
      # that looks like a broken release rather than a no-op.
      - name: Skip if this version is already on crates.io
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          if curl -sf -H "User-Agent: styloria-release (github.com/veripublica/styloria)" \
               "https://crates.io/api/v1/crates/styloria/$ver" > /dev/null; then
            echo "::notice::styloria $ver is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Guard 3: never publish code that does not pass its own tests. There is
      # no CI workflow on this repo yet, and a tag can point anywhere, so this
      # is the only place the tests are proven against the published commit.
      #
      # No `--locked`: styloria is a library and does not commit Cargo.lock
      # (see .gitignore), so there is nothing to lock against — the flag would
      # fail the job rather than protect it.
      - name: Test
        if: steps.check.outputs.skip == 'false' && !inputs.verify_only
        run: cargo test --all-features

      # Runs for a real publish, and on demand for a verify-only check. (On a
      # tag push `inputs` is null, so the second clause is simply falsy.)
      - name: Authenticate with crates.io
        if: steps.check.outputs.skip == 'false' || inputs.verify_only
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Report auth result (verify-only)
        if: inputs.verify_only
        run: |
          if [ -n "${{ steps.auth.outputs.token }}" ]; then
            echo "::notice::Trusted publishing works — crates.io issued a token. Nothing was published."
          else
            echo "::error::No token returned; the crates.io trusted-publishing link is not working."
            exit 1
          fi

      # `cargo publish` re-verifies by building the packaged tarball, which
      # also catches the classic "works locally, missing from the package"
      # failure before the upload happens.
      - name: Publish
        if: steps.check.outputs.skip == 'false' && !inputs.verify_only
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
